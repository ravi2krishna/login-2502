apiVersion: v1
kind: Namespace
metadata:
  name: dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev
  namespace: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev
  template:
    metadata:
      labels:
        app: dev
    spec:
      containers:
      - name: c1
        image: ravi2krishna/login-2502:1.1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: dev-svc
  namespace: dev
spec:
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30007
  selector:
    app: dev
  type: NodePort
---